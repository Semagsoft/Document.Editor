name: Build and Test

on:
  push:
    branches: [ main, master, cppqt6port ]
  pull_request:
    branches: [ main, master, cppqt6port ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        qt_version: ['6.5.3', '6.6.3', '6.7.2', '6.8.0']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_version }}
          modules: qtnetwork qttexttospeech qtcharts

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libxkbcommon-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
